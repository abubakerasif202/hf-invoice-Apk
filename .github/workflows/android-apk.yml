name: Build HF Invoices APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (wrapper-pinned version, cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests, lint and debug APK
        # The debug build signs with the standard auto-generated Android debug key;
        # no keystore is read from the repository.
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK exists and is a valid zip
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$apk"
          unzip -tq "$apk"
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HF-Removals-Invoices-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
