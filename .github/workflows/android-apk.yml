name: Build HF Invoices APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 37.1 (compile) and 36 (target) plus build tools
        run: sdkmanager --install "platforms;android-37.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (wrapper-pinned version, cached)
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Restore the app signing key (from secrets, never from the repository)
        # Same key on every build, so a new APK installs over the existing app. Without the secrets
        # (for example a fork pull request) the build falls back to the default debug key.
        env:
          KEYSTORE_B64: ${{ secrets.HF_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HF_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HF_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HF_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hf-signing.keystore"
            {
              echo "HF_RELEASE_STORE_FILE=$RUNNER_TEMP/hf-signing.keystore"
              echo "HF_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "HF_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "HF_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key restored from secrets."
          else
            echo "No signing secrets available; using the default debug key."
          fi

      - name: Unit tests, lint and APK builds
        run: ./gradlew --no-daemon :app:testQaUnitTest :app:lintDebug :app:assembleDebug :app:assembleQa :app:assembleQaAndroidTest --stacktrace

      - name: Build signed release APK
        if: env.HF_RELEASE_STORE_FILE != ''
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Verify the release APK and signing certificate
        if: env.HF_RELEASE_STORE_FILE != ''
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tq "$apk"
          cert_info=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$cert_info" | grep -E 'SHA-256|Signer #1 certificate DN' | tee -a "$GITHUB_STEP_SUMMARY"
          fingerprint=$(printf '%s\n' "$cert_info" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$fingerprint" = cbf41361728b002f46a4b5b88c368411b86055af9c36acdd4b82f65e0e002d91
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"

      - name: Upload signed release APK
        if: env.HF_RELEASE_STORE_FILE != ''
        uses: actions/upload-artifact@v7
        with:
          name: HF-Removals-Invoices-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
